nameOverride: ""

fullnameOverride: ""

replicaCount: 1

# imagePullSecrets: 
#   - name: harbor-registry

server:
  image:
    repository: inventree/inventree
    tag: 0.17.14
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    ports:
      app:
        port: 8000
        targetPort: 80
        name: http
      proxy:
        port: 80
        targetPort: 80
        name: proxy
  # extraVolumes:
  #   - name: gcs-sa
  #     secret:
  #       secretName: inventree-secret
  # extraVolumeMounts:
  #   - name: gcs-sa
  #     mountPath: /run/secrets/sa.json
  #     subPath: gcs_credentials
  #     readOnly: true


worker:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - inventree-server
        topologyKey: kubernetes.io/hostname

siteURL: https://inventree.local

extraEnv:
  INVENTREE_PLUGINS_ENABLED: "True"
  INVENTREE_AUTO_UPDATE: "True"
  INVENTREE_TAG: "stable"
  INVENTREE_EXT_VOLUME: "/home/inventree/data"
  INVENTREE_CUSTOMIZE: '{"hide_pui_banner":"true"}'

  INVENTREE_CACHE_ENABLED: "True"
  INVENTREE_CACHE_HOST: "inventree-redis-master"
  INVENTREE_CACHE_PORT: "6379"
  INVENTREE_TIMEZONE: "Europe/Amsterdam"

  INVENTREE_DEBUG: "False"
  INVENTREE_LOG_LEVEL: "WARNING"
  INVENTREE_DB_LOGGING: "True" 
  INVENTREE_LOGIN_DEFAULT_HTTP_PROTOCOL: "https"



redis:
  install: true
  architecture: standalone
  cluster:
    enabled: false
  metrics:
    enabled: false
  # Inventree doesn't authenticate with cache, hence disabled here.
  auth:
    enabled: false

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClass: ""
  existingClaim: ""

externalDatabase:
  enabled: true
  engine: postgresql
  auth:
    host: inventree-pg-cluster-rw
    port: "5432"
    database: "inventree"
    user: "inventree"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
    kubernetes.io/ingress.provider: nginx
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"    
    nginx.ingress.kubernetes.io/client-body-buffer-size: "30m"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "on"
  hosts:
    - host: inventree.local
      paths:
        - path: /
          pathType: Prefix
  tls:
   - secretName: inventree-cert-tls
     hosts:
       - inventree.local

auth:
  enabled: true
  adminURL: admin
  adminUser: admin
  adminEmail: 


sso:
  enabled: true
  social_backend: "allauth.socialaccount.providers.openid_connect"

smtp:
  enabled: true
  backend: "django.core.mail.backends.smtp.EmailBackend"
  host: "smtp.mailgun.org"
  port: "587"
  user: ""
  useTLS: "True"
  emailSender: ""

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []
